name: CI

# Prove a clean clone builds and passes on every push / PR to main. Runs the
# exact same gates as the local loop: unit suites, a prod build, and the e2e
# smoke against the running stack — no host toolchain, everything in containers.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minimal config: every value is optional and defaulted, so the app boots
      # with the committed example .env (empty ./roms, no IGDB keys) and degrades
      # to its "not configured" states. This is exactly the clean-clone path.
      - name: Configure (.env from the committed example)
        run: |
          cp .env.example .env
          # Point the backend at the committed ROM fixtures (empty files spanning
          # all six systems) so the real-app e2e flows have a deterministic library
          # to browse — the default ./roms is empty. A duplicate key wins over the
          # example's default. IGDB stays unset (degraded metadata) and the engine
          # is never fetched, exactly matching a clean clone.
          echo 'ROMS_DIR=./e2e/fixtures/roms' >> .env

      # Build backend, frontend (prod), and frontend-dev (for the Vitest runner).
      - name: Build images
        run: docker compose --profile dev build

      - name: Unit tests (pytest + Vitest)
        run: scripts/test.sh

      - name: Start the stack
        run: docker compose up -d frontend backend

      - name: Wait for the app to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8585/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::app did not come up"; exit 1

      - name: E2e smoke
        run: BASE_URL=http://localhost:8585 scripts/verify.sh

      - name: E2e (targeted flows)
        run: BASE_URL=http://localhost:8585 scripts/verify-full.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  # The desktop shell must keep compiling: the SW-stripped desktop frontend build
  # (beforeBuildCommand runs `vite build --mode desktop`) + the Tauri Rust crate,
  # together. Build-only on purpose — no bundle, no EmulatorJS engine, no
  # installers (those are the Phase-4 release pipeline); this is the compile gate
  # that catches a broken seam before it lands.
  tauri-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # Tauri v2's Linux webview + bundler system deps, plus the native
      # player's audio/gamepad stacks (cpal wants ALSA, gilrs wants udev).
      - name: Webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libudev-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The emu host's coreless unit tests (options tables, bindings mapping,
      # letterbox math, SRAM hashing...) — no cores, no ROMs, no GPU needed.
      - name: Emu host unit tests
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml

      - name: Build the desktop shell (no bundle)
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
