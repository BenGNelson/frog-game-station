# The desktop shell (Mode 1): a Tauri v2 window around the built frontend. The
# product version lives in ../package.json (tauri.conf.json points there); this
# crate's own version is never surfaced.
[package]
name = "frog-game-station-desktop"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "frog_game_station_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The native GL stage (the game surface the webview's chrome floats over).
glutin = "0.32"
glow = "0.14"
raw-window-handle = "0.6"
# The libretro host (the spike, grown up): dlopen'd cores, audio, pad, saves.
libloading = "0.8"
cpal = "0.15"
gilrs = "0.11"
png = "0.17"
ureq = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder"] }
