# Pinned native libretro cores — the desktop app's emulator engines.
# One line per artifact:  <core>  <platform>  <url>  <sha256-of-the-zip>
#
# The buildbot's nightly channel only serves ROLLING builds (latest/), so the
# URL cannot pin — THE HASH IS THE PIN. fetch-native-cores.sh verifies every
# download against its line here and fails loudly on a mismatch; when that
# happens, either restore the archived copy it kept from the last good fetch
# (cores/.archive/) or re-verify the new build by hand and update this line
# deliberately. Productionization (Phase 4): mirror the verified artifacts to
# a host we control and swap these URLs for the mirror's.
#
